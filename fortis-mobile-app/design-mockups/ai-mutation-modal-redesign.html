<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Mutation Preview Modal - Redesign</title>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #0a0a0a;
      --surface-elevated: rgba(255, 255, 255, 0.06);
      --surface-subtle: rgba(255, 255, 255, 0.03);
      --border-light: rgba(255, 255, 255, 0.06);
      --border-medium: rgba(255, 255, 255, 0.10);
      --text-primary: #fafafa;
      --text-secondary: #a3a3a3;
      --text-tertiary: #737373;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --success-border: rgba(34, 197, 94, 0.25);
      --warning: #f59e0b;
      --error: #dc2626;
      --overlay: rgba(0, 0, 0, 0.8);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--background);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Phone Frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      background: var(--background);
      border-radius: 40px;
      border: 8px solid #1a1a1a;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
    }

    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 34px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 100;
    }

    /* Overlay Background */
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Modal Container */
    .modal {
      width: 100%;
      max-width: 358px;
      height: 90%;
      background: var(--background);
      border-radius: 20px;
      border: 1px solid var(--border-medium);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Glass Fog Overlay */
    .glass-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(140, 140, 140, 0.06) 0%,
        rgba(100, 100, 100, 0.04) 33%,
        rgba(60, 60, 60, 0.03) 66%,
        rgba(20, 20, 20, 0.02) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Steel Pattern */
    .steel-pattern {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.008) 2px,
          rgba(255, 255, 255, 0.008) 4px
        );
      pointer-events: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(34, 197, 94, 0.2);
    }

    .header-icon svg {
      width: 22px;
      height: 22px;
      color: var(--success);
    }

    .header-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: var(--surface-elevated);
    }

    .close-btn svg {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
    }

    /* Summary Section */
    .summary {
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
      position: relative;
      z-index: 2;
    }

    .summary-badge {
      display: inline-flex;
      align-items: center;
      background: var(--success-bg);
      padding: 6px 14px;
      border-radius: 16px;
      margin-bottom: 8px;
    }

    .summary-badge-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--success);
      letter-spacing: -0.2px;
    }

    .summary-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      position: relative;
      z-index: 2;
    }

    /* Form Card */
    .form-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    .input-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 44px;
    }

    .input-field:focus {
      border-color: var(--success-border);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .input-field::placeholder {
      color: var(--text-tertiary);
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .input-row .input-group {
      flex: 1;
    }

    textarea.input-field {
      min-height: 72px;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
    }

    /* CTA Card - GREEN themed */
    .cta-card {
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid var(--success-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 8px;
    }

    .cta-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--success);
      margin-bottom: 4px;
    }

    .cta-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid var(--border-light);
      position: relative;
      z-index: 2;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-ghost {
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-tertiary);
    }

    .btn-ghost:hover {
      background: var(--surface-elevated);
      color: var(--text-secondary);
    }

    .btn-primary {
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* Title Section */
    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .page-title p {
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* Layout */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-title">
      <h1>AI Mutation Preview Modal</h1>
      <p>Redesigned with glass morphism + green theme</p>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>

      <div class="overlay">
        <div class="modal">
          <div class="steel-pattern"></div>
          <div class="glass-overlay"></div>

          <!-- Header -->
          <div class="header">
            <div class="header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.912 5.813a2 2 0 001.272 1.272L21 12l-5.813 1.912a2 2 0 00-1.272 1.272L12 21l-1.912-5.813a2 2 0 00-1.272-1.272L3 12l5.813-1.912a2 2 0 001.272-1.272L12 3z"/>
              </svg>
            </div>
            <span class="header-title">Review Template</span>
            <div class="close-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </div>
          </div>

          <!-- Summary -->
          <div class="summary">
            <div class="summary-badge">
              <span class="summary-badge-text">3 workouts &bull; 0 exercises</span>
            </div>
            <p class="summary-desc">Review and edit the draft before saving</p>
          </div>

          <!-- Content -->
          <div class="content">
            <div class="form-card">
              <div class="input-group">
                <label class="input-label">Template name</label>
                <input type="text" class="input-field" value="General Fitness 3-Day">
              </div>

              <div class="input-group">
                <label class="input-label">Description</label>
                <textarea class="input-field" placeholder="Short summary of the focus and intent">Balanced full-body program for general fitness and strength development</textarea>
              </div>

              <div class="input-row">
                <div class="input-group">
                  <label class="input-label">Difficulty</label>
                  <input type="text" class="input-field" value="intermediate">
                </div>
                <div class="input-group">
                  <label class="input-label">Weeks</label>
                  <input type="text" class="input-field" value="12">
                </div>
              </div>

              <div class="input-group">
                <label class="input-label">Goal</label>
                <input type="text" class="input-field" value="general_fitness">
              </div>
            </div>

            <!-- CTA Card -->
            <div class="cta-card">
              <p class="cta-title">Add this template to your template cards?</p>
              <p class="cta-desc">Tap Create to add it, or Cancel to discard.</p>
            </div>
          </div>

          <!-- Actions -->
          <div class="actions">
            <button class="btn btn-ghost">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Cancel
            </button>
            <button class="btn btn-primary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Create Template
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
