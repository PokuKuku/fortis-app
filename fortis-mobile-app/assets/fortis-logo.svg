<?xml version="1.0" encoding="UTF-8"?>
<!--
  FORTIS Logo - Shield + Lightning Bolt F

  The lightning bolt reads as both:
  1. Energy/power (fitness)
  2. The letter F (Fortis brand)
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shield stroke gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Lightning bolt gradient -->
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Glow filter for lightning -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow for shield -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>

  <!-- Shield Background -->
  <path
    d="M512 85 L853 256 L853 512 Q853 768 512 939 Q171 768 171 512 L171 256 Z"
    fill="#18181b"
    stroke="url(#shieldGradient)"
    stroke-width="6"
    filter="url(#shieldGlow)"
  />

  <!-- Inner Shield Detail -->
  <path
    d="M512 170 L768 299 L768 512 Q768 700 512 836 Q256 700 256 512 L256 299 Z"
    fill="none"
    stroke="#27272a"
    stroke-width="4"
  />

  <!-- Clean F with lightning point at bottom -->
  <path
    d="M340 160
       L680 160
       L680 260
       L450 260
       L450 380
       L620 380
       L620 480
       L450 480
       L450 750
       L500 750
       L420 900
       L340 750
       L390 750
       L340 480
       L340 160
       Z"
    fill="url(#boltGradient)"
    filter="url(#glow)"
  />

</svg>
