<?xml version="1.0" encoding="UTF-8"?>
<!--
  FORTIS App Icon - Shield + Dumbbell (DARK MODE, GRADIENT DUMBBELL)
  1024x1024 for iOS app icon
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shield gradient: premium dark metallic -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1116"/>
      <stop offset="12%" stop-color="#141620"/>
      <stop offset="24%" stop-color="#1a1d2a"/>
      <stop offset="36%" stop-color="#171a24"/>
      <stop offset="48%" stop-color="#12141c"/>
      <stop offset="60%" stop-color="#151826"/>
      <stop offset="72%" stop-color="#1b1f2e"/>
      <stop offset="84%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>

    <!-- Shield stroke gradient: teal → green → lime -->
    <linearGradient id="shieldStrokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5a3"/>
      <stop offset="18%" stop-color="#14b8a6"/>
      <stop offset="36%" stop-color="#22c55e"/>
      <stop offset="56%" stop-color="#4ade80"/>
      <stop offset="78%" stop-color="#6fdf57"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <!-- Dumbbell gradient: premium teal → green → lime with depth -->
    <linearGradient
      id="dumbbellGradient"
      x1="0"
      y1="122.88"
      x2="122.88"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#0ea5a3"/>
      <stop offset="12%" stop-color="#14b8a6"/>
      <stop offset="28%" stop-color="#1fcf79"/>
      <stop offset="42%" stop-color="#22c55e"/>
      <stop offset="58%" stop-color="#35d56f"/>
      <stop offset="72%" stop-color="#4ade80"/>
      <stop offset="86%" stop-color="#6fdf57"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <!-- Solid dark background (required for iOS - no transparency) -->
  <rect width="1024" height="1024" fill="#0a0a0a"/>

  <!-- Outer shield - thick green stroke -->
  <path
    d="M512 85 L853 256 L853 512 Q853 768 512 939 Q171 768 171 512 L171 256 Z"
    fill="url(#shieldGradient)"
    stroke="url(#shieldStrokeGradient)"
    stroke-width="18"
  />

  <!-- Inner shield detail - thin light stroke -->
  <path
    d="M512 150 L790 290 L790 512 Q790 720 512 870 Q234 720 234 512 L234 290 Z"
    fill="none"
    stroke="#404040"
    stroke-width="4"
  />

