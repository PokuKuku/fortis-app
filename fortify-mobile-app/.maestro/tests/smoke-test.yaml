# Smoke Test - Using coordinates for tab bar
# Tab bar is at bottom, tabs are evenly spaced

appId: com.fortis.app
---

# Launch the app
- launchApp

# Wait for app to load
- waitForAnimationToEnd

# Verify we're on the home screen
- assertVisible: "Start a Blank Workout"
- takeScreenshot: 01-home-screen

# Tap History tab (leftmost tab) - approximately 15% from left
- tapOn:
    point: "15%,95%"
- waitForAnimationToEnd
- takeScreenshot: 02-history-tab

# Tap Exercises tab (second from left) - approximately 30% from left
- tapOn:
    point: "30%,95%"
- waitForAnimationToEnd
- takeScreenshot: 03-exercises-tab

# Tap Programs tab (fourth from left) - approximately 70% from left
- tapOn:
    point: "70%,95%"
- waitForAnimationToEnd
- takeScreenshot: 04-programs-tab

# Tap Profile tab (rightmost) - approximately 85% from left
- tapOn:
    point: "85%,95%"
- waitForAnimationToEnd
- takeScreenshot: 05-profile-tab
